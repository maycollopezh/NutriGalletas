<!doctype html><html lang="es"><meta charset="utf-8"><title>NutriGalletas · Realtime</title><style>body{font:17px system-ui;margin:40px;max-width:1100px}button{padding:15px}#out>div{padding:12px;border-bottom:1px solid #ccc;overflow-wrap:anywhere}</style><h1>Comprobación de Realtime</h1><p>Comprueba el evento del producto ficticio ya creado. No registra otra compra ni venta.</p><button id="run">Comprobar recepción de cambios</button><div id="out"></div><script type="module">
import{config}from'./src/config.js';import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const a=createClient(config.supabaseUrl,config.supabasePublishableKey);const b=createClient(config.supabaseUrl,config.supabasePublishableKey,{auth:{autoRefreshToken:false}});
const out=document.querySelector('#out');function log(t,d){const e=document.createElement('div');e.textContent=t+': '+JSON.stringify(d);out.append(e)}function check(r){if(r.error)throw new Error(r.error.message);return r.data}
document.querySelector('#run').onclick=async function(){this.disabled=true;let ch;try{check(await a.auth.getUser());check(await b.auth.getUser());const auth=check(await b.auth.getSession());await b.realtime.setAuth(auth.session.access_token);log('Rol de la conexión B',check(await b.rpc('rol_actual')));const row=check(await b.from('productos').select('id,codigo').eq('codigo','QA-1792464556087').single());log('Fila visible por RLS',row.codigo);let readyResolve;const ready=new Promise(r=>readyResolve=r);let eventResolve;const received=new Promise(r=>eventResolve=r);const marker='Verificación realtime '+Date.now();
ch=b.channel('qa-ready-'+Date.now()).on('system','*',p=>{log('Estado del servidor',{extension:p.extension,status:p.status,message:p.message});if(p.extension==='postgres_changes'&&p.status==='ok')readyResolve(true)}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'productos',filter:'id=eq.'+row.id},p=>{log('Evento recibido',{id:p.new.id,presentacion:p.new.presentacion});if(p.new.presentacion===marker)eventResolve(true)}).subscribe(s=>log('Canal',s));
let timer;const isReady=await Promise.race([ready,new Promise(r=>timer=setTimeout(()=>r(false),20000))]);clearTimeout(timer);log('Listener confirmado por servidor',isReady);if(!isReady)throw new Error('El servidor no confirmó la suscripción postgres_changes.');
check(await a.from('productos').update({presentacion:marker}).eq('id',row.id));log('Cambio guardado por A',true);const ok=await Promise.race([received,new Promise(r=>timer=setTimeout(()=>r(false),20000))]);clearTimeout(timer);log('Realtime comprobado',ok);log('B lee el cambio por consulta',check(await b.from('productos').select('presentacion').eq('id',row.id).single()).presentacion===marker);
}catch(e){log('Error',e.message)}finally{if(ch)await b.removeChannel(ch);log('FIN',true)}};
</script></html>
